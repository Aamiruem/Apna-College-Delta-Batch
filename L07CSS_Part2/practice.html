<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Practice Qs1</title>
    <style>
        body {
            font-family: Arial, sans-serif;
        }
        h1 {
            color: #3b5998;
        }
        .userbtn {
            background-color: #4267B2;
            color: white;
            border: none;
            padding: 10px 20px;
            margin: 5px;
            cursor: pointer;
            border-radius: 5px;
        }
        #searchbtn {
            background-color: #42b72a;
            color: white;
            border: none;
            padding: 10px 20px;
            margin-left: 10px;
            cursor: pointer;
            border-radius: 5px;
        } 
        
        
        /* Style all h1 elements */
h1 {
    color: #1877f2; /* Facebook blue */
    font-family: Arial, sans-serif;
    text-align: center;
}

/* Style all buttons */
button {
    padding: 8px 16px;
    border-radius: 6px;
    border: none;
    cursor: pointer;
    font-size: 14px;
}

/* Style all input elements */
input {
    padding: 8px;
    border: 1px solid #ddd;
    border-radius: 6px;
    width: 250px;
}

/* Style horizontal rule */
hr {
    margin: 20px 0;
    border: 1px solid #eee;
}
    </style>
</head>
<body>
    <h1>Facebook</h1>
    <button class="userbtn">Log in</button>
    <button class="userbtn">Register</button>
    <hr />
    <label for="search">Search</label>
    <input placeholder="search your friends" id="search" />
    <button id="searchbtn">Search</button>
</body>
</html>
