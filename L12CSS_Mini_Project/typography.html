<!-- 🔑 Key CSS Properties for Typography
Here are the most important ones you’ll use:
- font-family → Defines the typeface (e.g., Arial, Times New Roman, custom Google Fonts).
- font-size → Controls text size (px, em, rem, %, etc.).
- font-weight → Sets thickness (normal, bold, 100–900).
- font-style → Italic, normal, oblique.
- line-height → Vertical spacing between lines.
- letter-spacing → Space between characters.
- word-spacing → Space between words.
- text-align → Alignment (left, right, center, justify).
- text-transform → Uppercase, lowercase, capitalize.
- color → Text color.
- text-shadow → Adds shadow effects.

📝 Example: Typography in HTML + CSS -->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Typography Example</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            font-size: 16px;
            line-height: 1.6;
            color: #333;
        }

        h1 {
            font-family: 'Georgia', serif;
            font-size: 2.5rem;
            font-weight: bold;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        p {
            font-size: 1rem;
            font-style: italic;
            margin-bottom: 20px;
        }

        .highlight {
            color: #e63946;
            font-weight: 600;
            text-shadow: 1px 1px 2px #ccc;
        }
    </style>
</head>

<body>
    <h1>Typography in CSS</h1>
    <p>This is a paragraph styled with <span class="highlight">CSS typography</span>.</p>
</body>

</html>

🌟 Best Practices
- Use web-safe fonts or load custom fonts via Google Fonts.
- Prefer relative units (em, rem) for scalability and accessibility.
- Maintain good contrast for readability.
- Use hierarchy (different sizes/weights for headings vs. body text).
- Keep line-height around 1.4–1.6 for comfortable reading.
