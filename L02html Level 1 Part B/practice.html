<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fruit List with Images & Links</title>

    <style>
        ul li {
            list-style: none;
            margin: 10px 0;
        }
        ul li img {
            width: 40px;
            margin-right: 10px;
            vertical-align: middle;
        }
    </style>
</head>
<body>

<ul>
    <li><a href="https://example.com/apple"><img src="https://via.placeholder.com/40"> Apple</a></li>
    <li><a href="https://example.com/banana"><img src="https://via.placeholder.com/40"> Banana</a></li>
    <li><a href="https://example.com/grapes"><img src="https://via.placeholder.com/40"> Grapes</a></li>
    <li><a href="https://example.com/orange"><img src="https://via.placeholder.com/40"> Orange</a></li>
    <li><a href="https://example.com/mango"><img src="https://via.placeholder.com/40"> Mango</a></li>
</ul>

</body>
</html>
