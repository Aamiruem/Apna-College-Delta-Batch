<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BR Tag Example</title>
</head>
<body>

<h2>Using the &lt;br&gt; Tag</h2>

<p>
    This is line one.<br>
    This is line two.<br>
    This is line three.<br><br>
    Two line breaks above created a blank line.
</p>

<h3>BR inside list:</h3>

<ul>
    <li>Apple<br>Fresh and red</li>
    <li>Orange<br>Full of Vitamin C</li>
    <li>Mango<br>King of fruits</li>
</ul>

<h3>BR inside Address:</h3>

<address>
    Aamir Hussain<br>
    Lucknow, India<br>
    Pin: 226001
</address>

</body>
</html>
