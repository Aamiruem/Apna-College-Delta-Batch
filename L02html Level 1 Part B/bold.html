<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Formatting</title>
</head>
<body>

<h2>Bold, Italic & Underline Examples</h2>

<p><b>Bold Text using &lt;b&gt;</b></p>
<p><strong>Bold Important Text using &lt;strong&gt;</strong></p>

<p><i>Italic Text using &lt;i&gt;</i></p>
<p><em>Emphasized Italic Text using &lt;em&gt;</em></p>

<p><u>Underlined Text using &lt;u&gt;</u></p>

<h3>Combined Example</h3>
<p>
    <b><i><u>This text is Bold + Italic + Underlined</u></i></b>
</p>

</body>
</html>
