<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TodoApp · clear & focused</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        body {
            background: #e1e9f2;
            background-image: radial-gradient(circle at 20% 30%, rgba(255,255,255,0.5) 0%, transparent 30%),
                              linear-gradient(145deg, #cbdbe9 0%, #dee9f2 100%);
            min-height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1rem;
        }
        .todo-app {
            width: 600px;
            max-width: 100%;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 48px;
            box-shadow: 0 25px 50px -12px rgba(0, 30, 50, 0.4), 0 2px 0 0 #ffffffcc inset, 0 -2px 0 0 #b5c8da inset;
            padding: 32px 30px 40px;
            border: 1px solid rgba(255,255,255,0.7);
        }
        h1 {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 0 0 8px 0;
            font-weight: 650;
            font-size: 2.8rem;
            letter-spacing: -1px;
            color: #193e52;
            text-shadow: 0 2px 5px rgba(255,255,255,0.6);
        }
        h1 span {
            background: #1c5068;
            color: white;
            font-size: 1.8rem;
            padding: 0 18px;
            border-radius: 100px;
            line-height: 1.4;
            box-shadow: 0 6px 0 #0e3342;
            transform: translateY(-2px);
        }
        .sub {
            margin-left: 8px;
            margin-bottom: 28px;
            font-weight: 500;
            color: #255e78;
            background: #eef4facc;
            display: inline-block;
            padding: 6px 24px;
            border-radius: 50px;
            font-size: 0.95rem;
            backdrop-filter: blur(4px);
            border: 1px solid white;
        }

        /* ----- input area ----- */
        .input-panel {
            display: flex;
            gap: 16px;
            background: #ffffffd6;
            padding: 8px 8px 8px 26px;
            border-radius: 80px;
            margin-bottom: 40px;
            box-shadow: 0 12px 25px -12px #244b60, 0 3px 0 0 #b6cfde inset;
            border: 1px solid #dfecf5;
        }
        .input-panel input {
            flex: 1;
            background: transparent;
            border: none;
            font-size: 1.2rem;
            padding: 14px 0;
            outline: none;
            color: #042433;
            font-weight: 500;
        }
        .input-panel input::placeholder {
            color: #678e9f;
            font-weight: 400;
        }
        .input-panel button {
            background: #1d5b77;
            border: none;
            color: white;
            width: 64px;
            height: 64px;
            border-radius: 40px;
            font-size: 2.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.15s;
            box-shadow: 0 8px 0 #0e384b, 0 0 0 2px #cbe1f0 inset;
            line-height: 1;
        }
        .input-panel button:hover {
            background: #256f90;
            transform: scale(1.02);
            box-shadow: 0 10px 0 #0e384b, 0 0 0 2px white inset;
        }
        .input-panel button:active {
            transform: translateY(4px);
            box-shadow: 0 4px 0 #0e384b;
        }

        /* ----- todo list ----- */
        .todo-list {
            list-style: none;
            padding: 0;
            margin: 0 0 25px 0;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .todo-item {
            background: #ffffffd1;
            backdrop-filter: blur(8px);
            border-radius: 70px;
            padding: 6px 6px 6px 22px;
            display: flex;
            align-items: center;
            gap: 15px;
            border: 1px solid #ffffff;
            box-shadow: 0 12px 25px -18px #10384b, 0 3px 0 0 #c0d6e6 inset;
            transition: all 0.2s;
        }
        .todo-item:hover {
            background: white;
            box-shadow: 0 20px 28px -20px #0f3447, 0 3px 0 0 #aac6dd inset;
            transform: scale(1.01) translateY(-2px);
        }

        /* custom checkbox */
        .todo-checkbox {
            appearance: none;
            -webkit-appearance: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: white;
            border: 3px solid #2c6783;
            box-shadow: 0 5px 0 #bedaf0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            color: #154455;
            cursor: pointer;
            transition: 0.1s;
            flex-shrink: 0;
        }
        .todo-checkbox:checked {
            background: #d0ebff;
            border-color: #144d66;
            box-shadow: 0 2px 0 #8eb6cf;
            transform: translateY(2px);
        }
        .todo-checkbox:checked::after {
            content: "✓";
            font-weight: 700;
            line-height: 1;
        }

        .todo-text {
            flex: 1;
            font-size: 1.4rem;
            font-weight: 530;
            color: #0b2d3d;
            padding: 14px 0;
            word-break: break-word;
            transition: 0.2s;
        }
        .todo-item.completed .todo-text {
            text-decoration: line-through 2px #2b778b;
            color: #437c94;
            opacity: 0.8;
        }

        /* delete button */
        .delete-btn {
            background: #fee1da;
            border: none;
            width: 58px;
            height: 58px;
            border-radius: 50%;
            font-size: 2.2rem;
            color: #b14733;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.15s;
            box-shadow: 0 7px 0 #cb9f95, 0 0 0 2px white inset;
            line-height: 1;
            flex-shrink: 0;
        }
        .delete-btn:hover {
            background: #ffc9bc;
            color: #8f3725;
            transform: rotate(3deg) scale(1.05);
            box-shadow: 0 9px 0 #b88478, 0 0 0 2px white inset;
        }
        .delete-btn:active {
            transform: translateY(5px);
            box-shadow: 0 3px 0 #b88478;
        }

        /* footer & stats */
        .app-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
            padding: 0 8px;
            color: #1f5068;
            font-weight: 550;
            flex-wrap: wrap;
            gap: 10px;
        }
        .counter {
            background: #e0eef9;
            border-radius: 50px;
            padding: 8px 24px;
            border: 1px solid white;
            backdrop-filter: blur(4px);
        }
        .clear-completed {
            background: transparent;
            border: 2px solid #457b97;
            color: #1a5068;
            padding: 8px 26px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: 0.15s;
            backdrop-filter: blur(4px);
        }
        .clear-completed:hover {
            background: #c3dff5;
            border-color: #1a5775;
            color: #062734;
        }
        .save-status {
            font-size: 0.9rem;
            background: #bedcf0;
            padding: 5px 20px;
            border-radius: 40px;
        }
    </style>
</head>
<body>
    <div class="todo-app" id="todoApp">
        <h1>
            ✅ TodoApp
            <span>list</span>
        </h1>
        <div class="sub">︎︎︎︎✦ add · check · delete ✦</div>

        <!-- input block -->
        <div class="input-panel">
            <input type="text" id="todoInput" placeholder="write a task ..." autofocus>
            <button id="addTodoBtn" aria-label="Add todo">+</button>
        </div>

        <!-- dynamic list -->
        <ul class="todo-list" id="todoList">
            <!-- sample items will be injected via JS -->
        </ul>

        <!-- footer with counters and utilities -->
        <div class="app-footer">
            <span class="counter" id="itemsCounter">0 items</span>
            <button class="clear-completed" id="clearCompletedBtn">✓ clear completed</button>
            <span class="save-status" id="saveIndicator">✨ ready</span>
        </div>
    </div>

    <script>
        (function(){
            // ----- core elements -----
            const todoList = document.getElementById('todoList');
            const inputField = document.getElementById('todoInput');
            const addBtn = document.getElementById('addTodoBtn');
            const counterSpan = document.getElementById('itemsCounter');
            const clearCompletedBtn = document.getElementById('clearCompletedBtn');
            const saveIndicator = document.getElementById('saveIndicator');

            // ----- load from localStorage (if any) -----
            let tasks = [];

            function loadTasks() {
                try {
                    const stored = localStorage.getItem('TodoApp_tasks');
                    if (stored) {
                        tasks = JSON.parse(stored);
                        // simple validation: must be array
                        if (!Array.isArray(tasks)) tasks = [];
                    } else {
                        // default sample tasks (always fresh if no storage)
                        tasks = [
                            { text: '📝 design todo layout', completed: false },
                            { text: '🔧 implement localStorage', completed: true },
                            { text: '✨ add custom checkbox', completed: false },
                            { text: '🧼 clear completed', completed: false },
                        ];
                    }
                } catch (e) {
                    tasks = [];
                }
                // ensure each task has required fields
                tasks = tasks.map(t => ({
                    text: t.text || 'untitled',
                    completed: !!t.completed
                }));
            }

            // ----- save to localStorage -----
            function saveTasks(showMessage = 'saved') {
                localStorage.setItem('TodoApp_tasks', JSON.stringify(tasks));
                saveIndicator.textContent = `⏱️ ${showMessage}`;
                setTimeout(() => {
                    saveIndicator.textContent = '✨ all good';
                }, 600);
            }

            // ----- render list based on tasks array -----
            function render() {
                // clear list
                todoList.innerHTML = '';

                if (tasks.length === 0) {
                    // show empty message
                    const emptyLi = document.createElement('li');
                    emptyLi.style.cssText = 'list-style: none; background: transparent; justify-content: center; display: flex; padding: 40px 20px; color: #2d6079; font-weight: 500; font-size: 1.2rem; border: 2px dashed #9cbdd5; border-radius: 80px; backdrop-filter: blur(6px);';
                    emptyLi.textContent = '✍️  add a task ...';
                    todoList.appendChild(emptyLi);
                } else {
                    tasks.forEach((task, index) => {
                        const li = createTodoElement(task, index);
                        todoList.appendChild(li);
                    });
                }

                updateCounter();
            }

            // ----- create DOM element from task data -----
            function createTodoElement(task, idx) {
                const li = document.createElement('li');
                li.className = 'todo-item' + (task.completed ? ' completed' : '');
                li.dataset.index = idx;

                // checkbox
                const cb = document.createElement('input');
                cb.type = 'checkbox';
                cb.className = 'todo-checkbox';
                cb.checked = task.completed;

                // text span
                const span = document.createElement('span');
                span.className = 'todo-text';
                span.textContent = task.text;

                // delete button
                const delBtn = document.createElement('button');
                delBtn.className = 'delete-btn';
                delBtn.innerHTML = '✕';
                delBtn.setAttribute('aria-label', 'delete task');

                // assemble
                li.appendChild(cb);
                li.appendChild(span);
                li.appendChild(delBtn);

                // --- attach event handlers ---

                // checkbox toggle: update task.completed & class, then save
                cb.addEventListener('change', function(e) {
                    task.completed = cb.checked; // update actual task
                    if (task.completed) {
                        li.classList.add('completed');
                    } else {
                        li.classList.remove('completed');
                    }
                    // update tasks array (the task reference is already the same)
                    saveTasks('updated');
                });

                // delete button: remove task from array and re-render (or remove li directly)
                delBtn.addEventListener('click', function(e) {
                    e.stopPropagation(); // avoid weirdness
                    // remove task by index
                    tasks.splice(idx, 1);
                    // we can re-render fully (ensures correct indexes)
                    render();
                    saveTasks('deleted');
                });

                // optional: double-click to edit? not part of spec, but we can keep it simple.
                return li;
            }

            // ----- update item counter (active tasks) -----
            function updateCounter() {
                const remaining = tasks.filter(t => !t.completed).length;
                const total = tasks.length;
                counterSpan.textContent = `${remaining} / ${total} left`;
            }

            // ----- add new task -----
            function addNewTask() {
                const rawText = inputField.value.trim();
                if (rawText === '') {
                    saveIndicator.textContent = '❗ cannot be empty';
                    setTimeout(() => { saveIndicator.textContent = '✨ ready'; }, 800);
                    return;
                }
                tasks.push({ text: rawText, completed: false });
                inputField.value = '';
                render();
                saveTasks('added');
                inputField.focus();
            }

            // ----- clear completed tasks -----
            function clearCompleted() {
                const newTasks = tasks.filter(t => !t.completed);
                if (newTasks.length === tasks.length) {
                    saveIndicator.textContent = '✓ no completed tasks';
                    setTimeout(() => { saveIndicator.textContent = '✨ ready'; }, 800);
                    return;
                }
                tasks = newTasks;
                render();
                saveTasks('cleared completed');
            }

            // ----- initial load and render -----
            loadTasks();
            render();
            saveIndicator.textContent = '✨ ready';

            // ----- event listeners -----
            addBtn.addEventListener('click', function(e) {
                e.preventDefault();
                addNewTask();
            });

            inputField.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    addNewTask();
                }
            });

            clearCompletedBtn.addEventListener('click', function() {
                clearCompleted();
            });

            // optional: manual save indicator for demonstration (already inside methods)

            // when tasks change via delete (render) we already call saveTasks. good.
            // ensure counter after every render

            // bonus: double‑click on header to reset to sample (for test)
            const header = document.querySelector('h1');
            header.addEventListener('dblclick', function() {
                tasks = [
                    { text: '📝 design todo layout', completed: false },
                    { text: '🔧 implement localStorage', completed: true },
                    { text: '✨ add custom checkbox', completed: false },
                    { text: '🧼 clear completed', completed: false },
                ];
                render();
                saveTasks('reset to sample');
            });
        })();
    </script>
</body>
</html>
